Description:
  Slug: COIN-OR-OptimizationSuite
  ShortName: COIN-OR Optimization Suite
  LongName: COIN-OR Optimization Suite
  ShortDescription: A collection of interoperable open source solvers from the COIN-OR repository.
  LongDescription: |2
    The COIN-OR Optimization Suite is a collection of interoperable open
    source solvers from the repository of open source software maintained
    by the COIN-OR Foundation.
  Manager: Ted Ralphs
  Homepage: https://github.com/coin-or/COIN-OR-OptimizationSuite
  License: Eclipse Public License 2.0
  LicenseURL: http://www.opensource.org/licenses/EPL-2.0
  Zenodo:
  IncludedIn:
    Package: COIN-OR-OptimizationSuite
  Language:
    - C++

